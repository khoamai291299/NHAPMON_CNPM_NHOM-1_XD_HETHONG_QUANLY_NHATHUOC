{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacity Admin Login</title>
    <link rel="stylesheet" href="{% static 'css/admin/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin/master.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin/style.css' %}">
</head>
<body>
    <div class="main-container">
        <!-- Optional top-right text from image -->
        <div class="content-wrapper">
            <!-- Left Side: Branding -->
            <div class="brand-section">
                <div class="logo-white-box">
                    <h2 class="sub-text">DRUG STORE</h2>
                    <h1 class="main-logo">
                        <span class="green">Pharma</span><span class="blue">city</span><span class="leaf">🍃</span>
                    </h1>
                </div>
                <p class="slogan">TIẾT KIỆM HƠN - SỐNG KHỎE HƠN</p>
            </div>

            <!-- Right Side: Login -->
            <div class="login-container">
                <form class="glass-card" id="loginForm" method="POST">
                    <h2 class="form-title">ADMIN LOGIN</h2>
                    {% csrf_token %}
                    <div class="field">
                        <label>Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="field">
                        <label>Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
                </form>
                {% if messages %}
                    <ul class="error-list">
                    {% for msg in messages %}
                        <li style="color:red;">{{ msg }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        </div>
    </div>
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
