{% extends "admin/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Mã quyền (không chỉnh sửa)</label>
            <input type="text" value="{{ role.role }}" class="form-control" disabled>
        </div>

        <div class="form-group">
            <label>Tên quyền</label>
            <input type="text" name="role_name" value="{{ role.role_name }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Trạng thái</label>
            <select name="status" class="form-control">
                <option {% if role.status == "Đang hoạt động" %}selected{% endif %}>Đang hoạt động</option>
                <option {% if role.status == "Ngưng hoạt động" %}selected{% endif %}>Ngưng hoạt động</option>
            </select>
        </div>

        <button class="btn btn-primary">Cập nhật</button>
    </form>
</div>
{% endblock %}
