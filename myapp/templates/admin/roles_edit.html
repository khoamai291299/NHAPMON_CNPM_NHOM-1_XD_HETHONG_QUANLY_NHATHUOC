{% load static %}

<form method="POST" action="{% url 'adminpanel:role_edit' role.role %}">
    {% csrf_token %}

    <div class="form-group">
        <label>Mã quyền</label>
        <input type="text" value="{{ role.role }}" class="form-control" disabled>
        <input type="hidden" name="role" value="{{ role.role }}">
    </div>

    <div class="form-group">
        <label>Tên quyền</label>
        <input type="text" name="role_name" value="{{ role.role_name }}" class="form-control" required>
    </div>

    <div class="form-group">
        <label>Trạng thái</label>
        <select name="status" class="form-control">
            <option value="Đang hoạt động" {% if role.status == "active" %}selected{% endif %}>Đang hoạt động</option>
            <option value="Ngưng hoạt động" {% if role.status == "inactive" %}selected{% endif %}>Ngưng hoạt động</option>
        </select>
    </div>

    <div class="d-flex justify-content-end">
        <button class="btn btn-primary">Cập nhật</button>
    </div>
</form>
